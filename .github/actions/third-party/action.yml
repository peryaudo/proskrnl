# The prep every test job shares: the pinned third_party builds (QEMU, Wine,
# limine, FreeType) and the apt toolchain that compiles against them.
#
# It lives in a composite action because the test job is SHARDED (see
# .github/workflows/test.yml): the same twenty lines would otherwise be
# copy-pasted into every shard, and a cache path that drifted in one copy
# would hand that shard a different oracle than the rest — the exact
# version-drift this cache exists to prevent.
#
# Exactly ONE job passes maintain-cache: true. That job owns the cache entry
# and the release mirror; the shards restore only. Ordering that job FIRST
# (needs:) is what keeps a pin bump costing one source build instead of one
# per shard.
name: pinned third_party builds
description: Restore (or build) the pinned third_party trees and install the apt toolchain.

inputs:
  maintain-cache:
    description: >
      "true" in the single setup job that owns the third_party cache: it saves
      the Actions cache entry and mirrors it to the release cache. Every other
      job restores only.
    required: false
    default: "false"

outputs:
  cache-hit:
    description: Whether the Actions cache entry for the current pins was restored.
    value: ${{ steps.tp-cache.outputs.cache-hit }}
  accel:
    description: The QEMU accelerator this runner actually got (kvm or tcg).
    value: ${{ steps.accel.outputs.accel }}

runs:
  using: composite
  steps:
    # .gitmodules pins third_party/wine by SSH URL; the runner has no SSH
    # key, so route github.com submodule fetches over HTTPS. Init the
    # submodules HERE, before the cache restore below overlays the build
    # outputs into the same trees (git refuses to clone into a non-empty
    # directory, so the order matters).
    - name: Fetch pinned submodules over HTTPS
      shell: bash
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --depth 1 \
          third_party/limine third_party/limine-protocol third_party/qemu third_party/wine \
          third_party/freetype third_party/flanterm third_party/lwip third_party/keycodemapdb

    # The submodule pins ARE the cache key (git ls-tree reads them from the
    # superproject tree, no submodule checkout needed). Only the submodules
    # whose builds this cache holds are named — flanterm has no build of its
    # own (the kernel Makefile compiles its two C files), so its pin must not
    # invalidate them. Must match tools/fetch_third_party.sh exactly.
    - name: Compute third_party cache key
      id: pins
      shell: bash
      run: echo "key=$(git ls-tree HEAD third_party/limine third_party/limine-protocol third_party/qemu third_party/wine third_party/freetype | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # v2: v1 entries were poisoned by a cancelled run saving a sources-only
    # snapshot (no builds) under the pins key; the version bump orphans them
    # (unused entries age out on their own).
    #
    # v3: the key is computed from the submodule PINS alone, so it does not
    # move when the way a pinned tree is CONFIGURED changes — and it just
    # did. QEMU is now configured --enable-gtk so `make rungui` gets a host
    # window deterministically, but every v2 entry holds a GTK-less
    # qemu-system-x86_64, and setup_linux.sh's "already built — skipping"
    # guard would serve it forever. The bump is what forces the rebuild;
    # freetype's new path rides along.
    #
    # v4: the same failure mode, one tree over. GUI-3 reconfigures the
    # pinned Wine --with-freetype --without-fontconfig against the pinned
    # FreeType (built native by tools/build_freetype.sh) so it is the
    # font-METRICS oracle, not just the ntapi one (docs/03 "the font
    # oracle"). Every v3 entry holds a --without-freetype wine; the pins
    # did not move, so only this prefix can force the rebuild.
    #
    # v5: the same failure mode again, one build set over. GUI-5 adds
    # dlls/user32/tests to what setup_linux.sh builds in the pinned tree
    # (the msg-gate binary, user32_test.exe). The pins did not move, so
    # every v4 entry — a tree without that exe — would satisfy the skip
    # guard forever; the prefix bump is what forces the one incremental
    # build.
    #
    # v6: the same failure mode, WOW64 edition. The wine configure moves to
    # --enable-archs=i386,x86_64, growing every dll an i386-windows PE tree
    # (the syswow64 payload and the 32-bit half of the wow64 oracle). Every
    # v5 entry is an x86_64-only tree that satisfies setup_linux.sh's skip
    # guards; the prefix bump forces the one rebuild.
    #
    # v7: the same failure mode, display edition. The wine configure moves to
    # --with-x --without-opengl, so the oracle finally has a display driver
    # (winex11.drv against the runner's Xvfb) instead of the null one that
    # refused every window. Every v6 entry is a --without-x tree, and it
    # satisfies every skip guard in setup_linux.sh that the marker added with
    # it does not; the prefix bump is what forces the one rebuild.
    #
    # v8: the same failure mode, network edition (Net-1). The qemu configure
    # moves to --enable-slirp so the net legs' -netdev user backend exists.
    # Every v7 entry is a slirp-less qemu-build whose binary satisfies the
    # existence skip guard; setup_linux.sh and fetch_third_party.sh both
    # gained a truthful marker (`-netdev help` listing `user`), but only
    # this prefix bump forces the one rebuild+republish. The pins did not
    # move; the configure did.
    #
    # v9: the same failure mode, audio edition (AUD-2, docs/23 §6b). The
    # wine configure moves to --with-pulse so the oracle finally has an
    # audio backend (winepulse.drv against the runner's start_pulse null
    # sink) instead of enumerating zero endpoints and turning every audio
    # pair into a skip that counts as green; the build set also grows
    # dlls/mmdevapi/tests and dlls/winmm/tests (the audio winetest gate).
    # Every v8 entry is a --without-pulse tree; setup_linux.sh and
    # fetch_third_party.sh gained the truthful PULSE_LIBS marker, but only
    # this prefix bump forces the one rebuild+republish.
    #
    # v10: the same failure mode, network edition (Net-2). The build set
    # grows dlls/ws2_32/tests (the socket winetest gate, the v5 user32
    # precedent). Every v9 entry is a tree without ws2_32_test.exe that
    # satisfies setup_linux.sh's skip guard only through the new staleness
    # probe; the prefix bump is what forces the one incremental
    # build+republish instead of a per-shard top-up.
    #
    # Kept in lockstep with the tp-v10 release assets: if only one door
    # moved, the stale oracle would come back in through the other.
    - name: Restore third_party builds
      id: tp-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          third_party/limine
          third_party/qemu/build
          third_party/wine
          third_party/freetype/x86_64-windows
          third_party/freetype/x86_64-linux
        key: third-party-v10-${{ steps.pins.outputs.key }}

    # Second-chance restore: the Actions cache evicts (7 days unused, 10 GB
    # repo budget) far more eagerly than the release-cache assets the
    # publish step below maintains, so on a miss pull the same trees from
    # the release before resigning to the hours-long source build.
    # Fail-soft: a miss (pins bumped and not yet republished) just falls
    # through to setup_linux.sh building from source, exactly as before.
    - name: Restore third_party builds from the release cache (fallback)
      if: steps.tp-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: tools/fetch_third_party.sh || echo "no release cache for this key — building from source"

    # The hosted runner's root disk is tight; the wine + qemu builds want
    # the space these unused preinstalled toolchains occupy — and so does
    # the oracle leg's per-worker wineprefix fan-out (a prefix is ~800 MB).
    - name: Free runner disk space
      shell: bash
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

    - name: Toolchain + pinned third_party builds (tools/setup_linux.sh)
      id: setup
      shell: bash
      run: tools/setup_linux.sh

    # The kernel and its modules are a few hundred small translation units
    # and every leg re-enters make; nothing here recurses into a sub-make,
    # so one -j for the whole job is both safe and the cheapest speedup
    # available. Written to the job env so every later step — including the
    # `make` calls inside tests/run/run.sh — inherits it.
    - name: Build in parallel (MAKEFLAGS=-j)
      shell: bash
      run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"

    # Record which accelerator this runner got. qemu.sh falls back to TCG
    # silently and correctly (the accelerator is not guest-observable), but
    # a runner that quietly lost /dev/kvm then looks exactly like a runner
    # that got slower for no reason — and every leg sends qemu.sh's stderr
    # to /dev/null, so the answer has to be asked for on its own.
    - name: QEMU accelerator
      id: accel
      shell: bash
      run: |
        accel="$(tools/qemu.sh --print-accel)"
        echo "accel=$accel" >> "$GITHUB_OUTPUT"
        echo "QEMU accelerator: $accel" | tee -a "$GITHUB_STEP_SUMMARY"
        [[ "$accel" == kvm ]] || echo "::warning::no KVM on this runner — every guest boot runs under TCG"

    # actions/cache's built-in post step only saves on job success; the
    # split restore/save keeps the long first build even when a later step
    # goes red, so the retry costs minutes, not hours. Gated on the SETUP
    # step's own outcome, not the job's: a failure elsewhere still saves,
    # but a cancellation or failure mid-build can never freeze a half-built
    # (or sources-only) tree under the key — saved entries are immutable,
    # so a bad save poisons the key until the pins move.
    - name: Save third_party builds
      if: always() && inputs.maintain-cache == 'true' && steps.setup.outcome == 'success' && steps.tp-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          third_party/limine
          third_party/qemu/build
          third_party/wine
          third_party/freetype/x86_64-windows
          third_party/freetype/x86_64-linux
        key: third-party-v10-${{ steps.pins.outputs.key }}

    # Mirror the finished builds to the rolling `third-party-cache`
    # prerelease so ephemeral containers outside Actions (Claude Code on
    # the web — tools/fetch_third_party.sh) can restore them: the Actions
    # cache above is not downloadable without Actions auth, release assets
    # are. Same gating rationale as the save step. Main pushes only —
    # branch pins without published assets just mean fetch_third_party.sh
    # reports a miss.
    - name: Publish third_party builds to the release cache
      if: always() && inputs.maintain-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEY: ${{ steps.pins.outputs.key }}
      run: |
        tag=third-party-cache
        gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease \
            --title "third_party build cache" \
            --notes "CI build cache for tools/fetch_third_party.sh — not a software release. Assets are zstd tarballs of the pinned third_party builds, keyed on the submodule pins."
        # distro.txt is uploaded LAST, so its presence is the "this key's
        # asset set is complete" sentinel — both for this skip-guard and
        # for fetch_third_party.sh (a partial upload just reruns here).
        #
        # v3: freetype joined the component set, and the tp-v2 assets carry
        # the pre---enable-gtk qemu besides. The sentinel above makes a
        # published key immutable, so republishing under the same name would
        # never happen — the fetch side would demand a freetype asset this
        # step permanently skips creating, and keep handing out a GTK-less
        # QEMU. The prefix bump forces the republish; the prune below then
        # drops the tp-v2 assets. Kept in lockstep with the Actions cache
        # key above: if only one of the two moved, the stale one would just
        # feed the same GTK-less build back in through the other door.
        #
        # v4: the wine configure gained the font backend (GUI-3 — the
        # font-metrics oracle); the immutable-sentinel argument above
        # applies unchanged, and the same lockstep rule holds.
        #
        # v7: and now the display driver (--with-x). Same argument again —
        # v5 and v6 moved for the same reason and left this comment alone,
        # so read the Actions-cache key's history above for the full list.
        #
        # v8: and now slirp (--enable-slirp, Net-1). Same argument again.
        #
        # v9: and now the audio backend (--with-pulse + the mmdevapi/winmm
        # test modules, AUD-2). Same argument again.
        existing="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
        if grep -qx "tp-v10-$KEY-distro.txt" <<<"$existing"; then
          echo "assets for key $KEY already published — skipping"
          exit 0
        fi
        pack="$RUNNER_TEMP/tp-pack"
        mkdir -p "$pack"
        # The tarballs hold binaries linked against this runner's glibc;
        # fetch_third_party.sh refuses to restore onto a different distro
        # release, so record which one built them.
        (. /etc/os-release && echo "$ID-$VERSION_ID") > "$pack/tp-v10-$KEY-distro.txt"
        # Assets over GitHub's 2 GiB per-asset limit are split; the fetch
        # side concatenates partNN in order.
        # freetype packs BOTH build outputs (PE static library + the native
        # shared library the oracle wine is configured against) and neither
        # the sources nor anything else in the submodule.
        for spec in limine:third_party/limine qemu-build:third_party/qemu/build \
                    wine:third_party/wine \
                    "freetype:third_party/freetype/x86_64-windows third_party/freetype/x86_64-linux"; do
          name="${spec%%:*}"; paths="${spec#*:}"
          tar -C "$GITHUB_WORKSPACE" --zstd -cf - $paths \
            | split -b 1900m -d -a 2 - "$pack/tp-v10-$KEY-$name.tar.zst.part"
        done
        gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$pack"/tp-v10-"$KEY"-*.part* --clobber
        gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$pack/tp-v10-$KEY-distro.txt" --clobber
        # Prune stale keys only after the new key uploaded whole, so a
        # failed upload never leaves the release empty.
        for a in $existing; do
          case "$a" in
            tp-v10-"$KEY"-*) ;;
            *) gh release delete-asset "$tag" "$a" -R "$GITHUB_REPOSITORY" -y ;;
          esac
        done
