# CI gate: build the image and run the test suites on every PR and on main.
#
# Merge blocking itself is repo configuration, not workflow code: a branch
# protection rule (or ruleset) on `main` with "Require status checks to pass
# before merging" pointing at this workflow's `test` check. Settings ->
# Branches (or Settings -> Rules -> Rulesets); the check appears in the
# picker after this workflow has run once.
#
# The pinned third_party QEMU and Wine are real source builds (hours on a
# hosted runner), so the finished builds are cached keyed on the submodule
# pins: the first run after a pin bump rebuilds, every other run restores
# and tools/setup_linux.sh skips straight through (it is idempotent by
# design). Keying on the pins means CI can never version-drift from the
# tree abi/ is generated from.
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # first uncached run builds QEMU + Wine
    # contents:write is for the release-cache publish step below (main pushes
    # only); PRs from forks get a read-only token regardless.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # .gitmodules pins third_party/wine by SSH URL; the runner has no SSH
      # key, so route github.com submodule fetches over HTTPS. Init the
      # submodules HERE, before the cache restore below overlays the build
      # outputs into the same trees (git refuses to clone into a non-empty
      # directory, so the order matters).
      - name: Fetch pinned submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 \
            third_party/limine third_party/limine-protocol third_party/qemu third_party/wine \
            third_party/freetype

      # The submodule pins ARE the cache key (git ls-tree reads them from the
      # superproject tree, no submodule checkout needed).
      - name: Compute third_party cache key
        id: pins
        run: echo "key=$(git ls-tree HEAD third_party | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # v2: v1 entries were poisoned by a cancelled run saving a sources-only
      # snapshot (no builds) under the pins key; the version bump orphans them
      # (unused entries age out on their own).
      #
      # v3: the key is computed from the submodule PINS alone, so it does not
      # move when the way a pinned tree is CONFIGURED changes — and it just
      # did. QEMU is now configured --enable-gtk so `make rungui` gets a host
      # window deterministically, but every v2 entry holds a GTK-less
      # qemu-system-x86_64, and setup_linux.sh's "already built — skipping"
      # guard would serve it forever. The bump is what forces the rebuild;
      # freetype's new path rides along. Expect the first run on this key to
      # pay the full QEMU + Wine source build.
      #
      # v4: the same failure mode, one tree over. GUI-3 reconfigures the
      # pinned Wine --with-freetype --without-fontconfig against the pinned
      # FreeType (built native by tools/build_freetype.sh) so it is the
      # font-METRICS oracle, not just the ntapi one (docs/03 "the font
      # oracle"). Every v3 entry holds a --without-freetype wine; the pins
      # did not move, so only this prefix can force the rebuild.
      # setup_linux.sh detects a stale tree on its own (SONAME_LIBFREETYPE in
      # the generated config.h) and would rebuild it from source, but that
      # costs hours on every run until the key moves — which is the point of
      # moving it. freetype's new x86_64-linux output joins the paths below.
      # Kept in lockstep with the tp-v4 release assets: if only one door
      # moved, the stale oracle would come back in through the other.
      - name: Restore third_party builds
        id: tp-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/limine
            third_party/qemu/build
            third_party/wine
            third_party/freetype/x86_64-windows
            third_party/freetype/x86_64-linux
          key: third-party-v4-${{ steps.pins.outputs.key }}

      # Second-chance restore: the Actions cache evicts (7 days unused, 10 GB
      # repo budget) far more eagerly than the release-cache assets the
      # publish step below maintains, so on a miss pull the same trees from
      # the release before resigning to the hours-long source build.
      # Fail-soft: a miss (pins bumped and not yet republished) just falls
      # through to setup_linux.sh building from source, exactly as before.
      - name: Restore third_party builds from the release cache (fallback)
        if: steps.tp-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/fetch_third_party.sh || echo "no release cache for this key — building from source"

      # The hosted runner's root disk is tight; the wine + qemu builds want
      # the space these unused preinstalled toolchains occupy.
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Toolchain + pinned third_party builds (tools/setup_linux.sh)
        id: setup
        run: tools/setup_linux.sh

      # CI boots a VIRGIN image every time, so the boot runs the full CUI-1
      # firstboot INF pass ("minutes under TCG" — see run.sh persist), which
      # qemu.sh's 30s default kill would cut short; the timeout is only a
      # backstop — a green boot exits via isa-debug-exit as soon as it's done.
      - name: make test (QEMU boot, [KTEST] verdict on serial)
        run: make test
        env:
          TIMEOUT: "600"

      - name: ntapi oracle — the spec gate (tests/run/run.sh oracle)
        run: tests/run/run.sh oracle

      - name: ntapi on proskrnl — the regression gate (tests/run/run.sh proskrnl)
        run: tests/run/run.sh proskrnl

      # One deterministic batch (seed 1, 64 programs, anon-name policy — the
      # documented clean green gate): random Nt* sequences, oracle vs kernel.
      - name: differential fuzzer (tests/run/run.sh fuzz)
        run: tests/run/run.sh fuzz

      - name: registry persistence across reboot (tests/run/run.sh persist)
        run: tests/run/run.sh persist

      - name: serial console echo + interactive cmd (tests/run/run.sh console)
        run: tests/run/run.sh console

      - name: curated winetest subset, oracle + proskrnl (tests/run/run.sh winetest)
        run: tests/run/run.sh winetest

      - name: CUI-1 firstboot registry differential (tests/run/run.sh firstboot)
        run: tests/run/run.sh firstboot

      - name: CUI-3 SCM round-trip + reboot survival (tests/run/run.sh scm)
        run: tests/run/run.sh scm

      - name: CUI-4 Ctrl+C, tasklist/taskkill, job tool (tests/run/run.sh procs)
        run: tests/run/run.sh procs

      # GUI-1: the verdict is a picture. The guest paints through
      # \Device\Fb0 and reports what it painted; the pixels come back out of
      # QEMU's screendump and a QMP-injected key comes back out of
      # \Device\Input0 (docs/03 "GUI-1 notes" for why this stands in for an
      # oracle leg).
      - name: GUI-1 framebuffer screendump + key input (tests/run/run.sh gui)
        run: tests/run/run.sh gui

      # GUI-2: winemine.exe on the scanout — unmodified user32/gdi32/comctl32
      # and winemine over the PE build of win32u, painting through winefb.drv.
      # Same screendump differential as GUI-1 (the guest reports the window
      # rect it painted; QEMU's device model returns the pixels). The whole
      # GUI userland boots under TCG here, so the deadlines are generous.
      - name: GUI-2 winemine on screen (tests/run/run.sh gui2)
        run: tests/run/run.sh gui2
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # The FAT32 integration suite (PR #38, docs/08): boot-and-churn legs
      # convicted by INDEPENDENT host oracles (fsck.fat/mtools/fatsweep) after
      # QEMU exits. mtools + dosfstools come from tools/setup_linux.sh.
      - name: FAT32 host<->kernel interop (tests/run/run.sh fatinterop)
        run: tests/run/run.sh fatinterop

      - name: FAT32 churn stress across geometries (tests/run/run.sh fatstress)
        run: tests/run/run.sh fatstress

      - name: FAT32 torn-write prefix replay (tests/run/run.sh tornwrite)
        run: tests/run/run.sh tornwrite

      # actions/cache's built-in post step only saves on job success; the
      # split restore/save keeps the long first build even when a test leg
      # goes red, so the retry costs minutes, not hours. Gated on the SETUP
      # step's own outcome, not the job's: a red test leg still saves, but a
      # cancellation or failure mid-build can never freeze a half-built (or
      # sources-only) tree under the key — saved entries are immutable, so a
      # bad save poisons the key until the pins move.
      - name: Save third_party builds
        if: always() && steps.setup.outcome == 'success' && steps.tp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/limine
            third_party/qemu/build
            third_party/wine
            third_party/freetype/x86_64-windows
            third_party/freetype/x86_64-linux
          key: third-party-v4-${{ steps.pins.outputs.key }}

      # Mirror the finished builds to the rolling `third-party-cache`
      # prerelease so ephemeral containers outside Actions (Claude Code on
      # the web — tools/fetch_third_party.sh) can restore them: the Actions
      # cache above is not downloadable without Actions auth, release assets
      # are. Same gating rationale as the save step: a red test leg still
      # publishes finished builds, a failed/cancelled setup never publishes
      # a half-built tree. Main pushes only — branch pins without published
      # assets just mean fetch_third_party.sh reports a miss.
      - name: Publish third_party builds to the release cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.pins.outputs.key }}
        run: |
          tag=third-party-cache
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease \
              --title "third_party build cache" \
              --notes "CI build cache for tools/fetch_third_party.sh — not a software release. Assets are zstd tarballs of the pinned third_party builds, keyed on the submodule pins."
          # distro.txt is uploaded LAST, so its presence is the "this key's
          # asset set is complete" sentinel — both for this skip-guard and
          # for fetch_third_party.sh (a partial upload just reruns here).
          #
          # v3: freetype joined the component set, and the tp-v2 assets carry
          # the pre---enable-gtk qemu besides. The sentinel above makes a
          # published key immutable, so republishing under the same name would
          # never happen — the fetch side would demand a freetype asset this
          # step permanently skips creating, and keep handing out a GTK-less
          # QEMU. The prefix bump forces the republish; the prune below then
          # drops the tp-v2 assets. Kept in lockstep with the Actions cache
          # key above: if only one of the two moved, the stale one would just
          # feed the same GTK-less build back in through the other door.
          #
          # v4: the wine configure gained the font backend (GUI-3 — the
          # font-metrics oracle); the immutable-sentinel argument above
          # applies unchanged, and the same lockstep rule holds.
          existing="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qx "tp-v4-$KEY-distro.txt" <<<"$existing"; then
            echo "assets for key $KEY already published — skipping"
            exit 0
          fi
          pack="$RUNNER_TEMP/tp-pack"
          mkdir -p "$pack"
          # The tarballs hold binaries linked against this runner's glibc;
          # fetch_third_party.sh refuses to restore onto a different distro
          # release, so record which one built them.
          (. /etc/os-release && echo "$ID-$VERSION_ID") > "$pack/tp-v4-$KEY-distro.txt"
          # Assets over GitHub's 2 GiB per-asset limit are split; the fetch
          # side concatenates partNN in order.
          # freetype packs BOTH build outputs (PE static library + the native
          # shared library the oracle wine is configured against) and neither
          # the sources nor anything else in the submodule.
          for spec in limine:third_party/limine qemu-build:third_party/qemu/build \
                      wine:third_party/wine \
                      "freetype:third_party/freetype/x86_64-windows third_party/freetype/x86_64-linux"; do
            name="${spec%%:*}"; paths="${spec#*:}"
            tar -C "$GITHUB_WORKSPACE" --zstd -cf - $paths \
              | split -b 1900m -d -a 2 - "$pack/tp-v4-$KEY-$name.tar.zst.part"
          done
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$pack"/tp-v4-"$KEY"-*.part* --clobber
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$pack/tp-v4-$KEY-distro.txt" --clobber
          # Prune stale keys only after the new key uploaded whole, so a
          # failed upload never leaves the release empty.
          for a in $existing; do
            case "$a" in
              tp-v4-"$KEY"-*) ;;
              *) gh release delete-asset "$tag" "$a" -R "$GITHUB_REPOSITORY" -y ;;
            esac
          done

      # The panic dump is the debugger (Art. 9): a red run must ship its
      # serial logs.
      - name: Upload serial logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs
          # No recursive glob over build/tests: the oracle wineprefix's
          # dosdevices/z: symlinks to /, and walking it EACCESes the upload.
          path: |
            build/serial.log
            build/tests/*.log
            build/tests/*.ppm
            build/tests/wtests/*.log
            build/tests/fatcheck/*.log
            build/tests/fuzz/repro/**
          if-no-files-found: ignore
