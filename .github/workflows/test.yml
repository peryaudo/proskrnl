# CI gate: build the image and run the test suites on every PR and on main.
#
# SHAPE. The suite is a long list of independent QEMU boots, and it used to
# run as one serial job: ~33 minutes of wall clock on a warm cache, and the
# first red leg cancelled every leg after it, so one flaky verdict cost a
# whole re-run to learn anything about the rest. It is now a fan-out:
#
#   setup ──┬── boot / oracle / ntapi / cui-a / cui-b / gui / msg ──┬── all-green
#           └── (each shard restores the same pinned third_party)   │
#   style ──────── (no third_party, no setup) ─────────────────────┘
#
# `setup` exists to own the third_party cache. Every shard needs those trees,
# and if each shard could miss the cache on its own, the first run after a
# submodule pin bump would build QEMU and Wine from source once PER SHARD.
# Ordering one job in front of the fan-out makes that cost payable exactly
# once; on a warm cache the hop is the same few minutes every shard pays.
#
# Inside a shard, every leg carries `if: ${{ !cancelled() }}` so a red leg
# does not hide the legs behind it — the job still ends red, but the run
# reports every verdict it was able to reach.
#
# Merge blocking is repo configuration, not workflow code: a branch
# protection rule (or ruleset) on `main` with "Require status checks to pass
# before merging" pointing at the `all-green` check below — the ONE check to
# require, since it aggregates every shard (Settings -> Branches, or Settings
# -> Rules -> Rulesets; the check appears in the picker after this workflow
# has run once). Requiring the individual shards instead would work, but then
# adding a shard silently stops being blocking until someone edits the rule.
# NOTE for whoever flips that setting: the old required check was named
# `test`, and no job here is called that any more.
#
# The pinned third_party QEMU and Wine are real source builds (hours on a
# hosted runner), so the finished builds are cached keyed on the submodule
# pins: the first run after a pin bump rebuilds, every other run restores
# and tools/setup_linux.sh skips straight through (it is idempotent by
# design). Keying on the pins means CI can never version-drift from the
# tree abi/ is generated from. All of that lives in the composite action
# .github/actions/third-party, which every job below uses.
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The non-semantic gates: `make format` (docs/15) — the blocking frontier
  # (G14), clang-format's layout, clang-tidy's naming + correctness lints —
  # and `make gen-check`, the generated-source gate (Art. 4 / G4). No QEMU and
  # no Wine BUILD: clang-tidy needs the two header-only submodules the kernel
  # compiles against, and the generators need the pinned wine SOURCE (headers,
  # NLS, INF, .rgs), all of which a shallow submodule checkout gives. So this
  # shard still skips `setup` and the third_party cache entirely and answers
  # in minutes while the boot shards are still restoring.
  #
  # `make format` REWRITES source, which is exactly what makes it checkable
  # here: run it on a clean checkout and the tree must come back byte
  # identical. Two ways to be red, and the messages differ — a clang-tidy
  # finding fails the make step and names the file:line; pure layout drift
  # passes it and shows up as the diff below.
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # limine.h and flanterm's headers are #included by kernel/init; without
      # them clang-tidy cannot parse those TUs. lwIP's headers are the same
      # dependency one tree over (Net-1): drivers/net/netd.c includes them,
      # so the tidy pass over drivers/net/ cannot parse without the
      # submodule. All are https in .gitmodules (only third_party/wine
      # needs the ssh rewrite), and none is built here.
      - name: Fetch the header-only submodules
        run: git submodule update --init --depth 1 third_party/limine-protocol third_party/flanterm third_party/lwip

      # `make gen-check` reads TRACKED files of the pinned Wine tree —
      # include/*.h, dlls/ntdll/ntsyscalls.h, nls/l_intl.nls,
      # dlls/kernelbase/kernelbase.rgs — and builds none of it, so a shallow
      # checkout is the whole cost. (loader/wine.inf is a configure product,
      # which is why gen_license is not in that target; see the Makefile.)
      # .gitmodules pins the tree by SSH URL and the runner has no key, hence
      # the same HTTPS rewrite the third-party composite action uses.
      - name: Fetch the pinned Wine source (generators read it; nothing builds it)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 third_party/wine

      # Art. 4 / G4: abi/, the syscall number space and the three generated
      # data tables must match what their generators produce from THIS pin.
      # Ahead of `make format` because it is seconds, and a stale abi/ makes
      # every verdict behind it suspect.
      - name: make gen-check (G4 — the generated sources match the pin)
        run: make gen-check

      # Same packages tools/setup_linux.sh installs, minus everything that is
      # only there to build QEMU/Wine. clang-tidy is NOT preinstalled on the
      # runner image; ubuntu-24.04's is 18.x, the version the tree is clean
      # under and the one setup_linux.sh gives a dev box.
      - name: apt toolchain (clang-format, clang-tidy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format clang-tidy

      - name: make format (G14 + docs/15 layout and naming)
        run: make format

      - name: the tree must be unchanged by it
        run: git diff --exit-code

  # The cache owner. Nothing runs here but the prep itself: on a warm cache
  # it is a restore, on a cold one it is the QEMU + Wine source build every
  # shard below would otherwise duplicate.
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # first uncached run builds QEMU + Wine
    # contents:write is for the release-cache publish step inside the
    # composite action (main pushes only); PRs from forks get a read-only
    # token regardless.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/third-party
        with:
          maintain-cache: "true"

  # The kernel's own boot verdict plus the host-oracle FAT32 battery: the
  # legs with no Wine userland in them.
  boot:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/third-party

      # CI boots a VIRGIN image every time, so the boot runs the full CUI-1
      # firstboot INF pass ("minutes under TCG" — see run.sh persist), which
      # qemu.sh's 30s default kill would cut short; the timeout is only a
      # backstop — a green boot exits via isa-debug-exit as soon as it's done.
      - name: make test (QEMU boot, [KTEST] verdict on serial)
        if: ${{ !cancelled() }}
        run: make test
        env:
          TIMEOUT: "600"

      # One deterministic batch (seed 1, 64 programs, anon-name policy — the
      # documented clean green gate): random Nt* sequences, oracle vs kernel.
      - name: differential fuzzer (tests/run/run.sh fuzz)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh fuzz

      # The FAT32 integration suite (PR #38, docs/08): boot-and-churn legs
      # convicted by INDEPENDENT host oracles (fsck.fat/mtools/fatsweep) after
      # QEMU exits. mtools + dosfstools come from tools/setup_linux.sh.
      - name: FAT32 host<->kernel interop (tests/run/run.sh fatinterop)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh fatinterop

      - name: FAT32 churn stress across geometries (tests/run/run.sh fatstress)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh fatstress

      - name: FAT32 torn-write prefix replay (tests/run/run.sh tornwrite)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh tornwrite

      - uses: ./.github/actions/serial-logs
        if: failure()
        with:
          shard: boot

  # The spec gate (G5/Art. 5): every tests/ntapi case under the pinned Wine.
  # It runs no proskrnl code at all, which is exactly why it gets its own
  # shard rather than sitting in front of the legs that do — it was the
  # longest single leg here and it blocked all of them. It stays a REQUIRED
  # check: a red oracle means the spec the proskrnl leg is judged against is
  # wrong, so a green proskrnl leg under a red oracle is a false green.
  oracle:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/third-party

      - name: ntapi oracle — the spec gate (tests/run/run.sh oracle)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh oracle

      - uses: ./.github/actions/serial-logs
        if: failure()
        with:
          shard: oracle

  # The same .exes on the kernel, plus the suites that boot a Wine userland
  # to a serial verdict.
  ntapi:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # was 60 before AUD-2: the winetest sweep is two
                          # boots now (the audio pairs ride their own image,
                          # docs/23 §6c), and the first cap hit killed the
                          # job mid-boot at exactly :60 (the gui shard's
                          # "was 110 with eight boots" precedent)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/third-party

      - name: ntapi on proskrnl — the regression gate (tests/run/run.sh proskrnl)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh proskrnl

      - name: winetest non-GUI sweep, oracle + proskrnl (tests/run/run.sh winetest)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh winetest

      - name: registry persistence across reboot (tests/run/run.sh persist)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh persist

      - name: CUI-1 firstboot registry differential (tests/run/run.sh firstboot)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh firstboot

      - uses: ./.github/actions/serial-logs
        if: failure()
        with:
          shard: ntapi

  # The interactive-console acceptances, first half. Split from cui-b purely
  # by cost: each leg is a full boot driven from console_expect.py, and two
  # ~5-minute shards beat one ~10-minute one.
  cui-a:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/third-party

      - name: serial console echo + interactive cmd (tests/run/run.sh console)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh console

      - name: CUI-3 SCM round-trip + reboot survival (tests/run/run.sh scm)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh scm

      - name: CUI-4 Ctrl+C, tasklist/taskkill, job tool (tests/run/run.sh procs)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh procs

      # WOW64's gate 1. Lands on cui-a rather than cui-b for budget: cui-b
      # measures 52m32s against its 90 cap, cui-a ~30m against 60, and this
      # leg is one more full boot.
      - name: WOW64 — a 32-bit Win32 CUI binary runs (tests/run/run.sh wow64)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh wow64

      - uses: ./.github/actions/serial-logs
        if: failure()
        with:
          shard: cui-a

  # 90 for the same reason the gui job below carries it: five legs that each
  # boot a virgin image through the firstboot INF pass, measured at 52m32s
  # against a 60 cap, and an overrun here loses every leg's verdict at once
  # rather than reporting the one that was slow.
  cui-b:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/third-party

      - name: CUI-5 ren/move/replace under cmd.exe (tests/run/run.sh files)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh files

      - name: CUI-6 times/handle-redirect/restricted-token under cmd.exe (tests/run/run.sh cui6)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh cui6

      - name: CUI-7 reg save/load reboot round-trip + write-watch app (tests/run/run.sh cui7)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh cui7

      - name: CUI-8 overlap verdicts, throttled progress, determinism + stress (tests/run/run.sh cui8)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh cui8

      - name: CUI-9 image-master sharing + COW resident-process ceiling (tests/run/run.sh cui9)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh cui9

      - name: Net-1 DHCP + in-kernel echo + pcap content (tests/run/run.sh net)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh net

      - uses: ./.github/actions/serial-logs
        if: failure()
        with:
          shard: cui-b

  # Six full GUI boots, each ~7 minutes under TCG. The cap is 90 rather than
  # the 60 every other shard gets because the measured job is already ~52
  # minutes with GUI-1 failing early, and a job-level timeout is the worst
  # failure mode here: it kills the run BEFORE the serial-logs step, so every
  # leg's verdict and the logs that would explain it are lost at once.
  gui:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 125   # nine boots under TCG; was 110 with eight before AUD-1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/third-party

      # GUI-1: the verdict is a picture. The guest paints through
      # \Device\Fb0 and reports what it painted; the pixels come back out of
      # QEMU's screendump and a QMP-injected key comes back out of
      # \Device\Input0 (docs/03 "GUI-1 notes" for why this stands in for an
      # oracle leg).
      - name: GUI-1 framebuffer screendump + key input (tests/run/run.sh gui)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh gui
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # AUD-1: the verdict is a recording — the audio analog of GUI-1's
      # screendump. The guest plays a deterministic S16 pattern through
      # \Device\Snd0 and the harness finds it sample-exact in the WAV that
      # QEMU's wav audiodev recorded (docs/23 §6a). Rides this shard because
      # it is the same virgin-image full-firstboot boot the GUI legs pay.
      - name: AUD-1 sample-exact playback in a recorded WAV (tests/run/run.sh audio)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh audio
        env:
          TIMEOUT: "1200"
          AUDIO_DEADLINE: "900"

      # GUI-2: winemine.exe on the scanout — unmodified user32/gdi32/comctl32
      # and winemine over the PE build of win32u, painting through winefb.drv.
      # Same screendump differential as GUI-1 (the guest reports the window
      # rect it painted; QEMU's device model returns the pixels). The whole
      # GUI userland boots under TCG here, so the deadlines are generous.
      - name: GUI-2 winemine on screen (tests/run/run.sh gui2)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh gui2
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # GUI-3: two GUI processes over wineserver-lite, screendump-differential
      # graded the same way as GUI-1/GUI-2.
      - name: GUI-3 two GUI processes over wineserver-lite (tests/run/run.sh gui3)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh gui3
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # GUI-4: overlapping windows, compositing, click routing and a dragged
      # window, driven through QEMU's injected tablet/keyboard.
      - name: GUI-4 overlap composited, click routed, window dragged (tests/run/run.sh gui4)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh gui4
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # GUI-5: clipboard, WH_KEYBOARD_LL hooks, AttachThreadInput and the
      # font-metrics differential, cross-process over the unmodified server.
      - name: GUI-5 clipboard, hooks, AttachThreadInput, font diff (tests/run/run.sh gui5)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh gui5
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # GUI-5, the windowed conhost: an interactive cmd.exe session driven
      # entirely through the real console window, with the file half of the
      # verdict read back out of the image (mtools) and the pixel half from
      # the scanout.
      - name: "GUI-5 conhost dual-mode: windowed cmd.exe (tests/run/run.sh gui5con)"
        if: ${{ !cancelled() }}
        run: tests/run/run.sh gui5con
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # WOW64's gate 2, and the one `make rungui` is graded by: a 32-bit
      # .exe typed at that same windowed console, painting a window on the
      # desktop the 64-bit applets share. Here rather than beside the CUI
      # wow64 leg on cui-a because it needs the whole GUI stack and the
      # scanout, which is what this shard already provisions.
      - name: "WOW64 GUI: a 32-bit app on the shared desktop (tests/run/run.sh wow64gui)"
        if: ${{ !cancelled() }}
        run: tests/run/run.sh wow64gui
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # GUI-6: Wine's explorer owns the desktop — wallpaper + file window
      # against the blessed golden (exact compare, deterministic: no
      # tablet, one scanout mode, poll-until-match).
      - name: "GUI-6 the Wine desktop vs tests/gui/golden/desktop.ppm (tests/run/run.sh gui6)"
        if: ${{ !cancelled() }}
        run: tests/run/run.sh gui6
        env:
          TIMEOUT: "1200"
          GUI_DEADLINE: "900"

      # The compositor unit suite: the real compose.c/blit.c objects against
      # a mocked seam under the pinned wine — every compositor policy bug
      # (the winemine close afterimage included) is pinned here, in seconds.
      - name: "Compositor units (tests/run/run.sh winefbunit)"
        if: ${{ !cancelled() }}
        run: tests/run/run.sh winefbunit

      - uses: ./.github/actions/serial-logs
        if: failure()
        with:
          shard: gui

  # GUI-5's trophy: Wine's own user32:msg — 21.5 kloc, ~85 test functions —
  # over the full GUI stack, with the failure count ratcheted against
  # tests/winetest/msg-budget.txt (docs/03 "GUI-5 winetest notes" has the
  # policy and the named divergences behind the current number).
  #
  # ADVISORY ON PULL REQUESTS, BLOCKING ON MAIN — the all-green job below is
  # where that is decided; docs/03 "GUI-5 winetest notes" carries the whole
  # reasoning. Up to twelve of the counted assertions are settled by
  # emulated-machine speed rather than by semantics (msg-budget.txt names
  # them: an unkilled 100 ms timer in test_PeekMessage3, a one-second
  # FindWindow poll in test_WM_COPYDATA), and the budget is a ceiling sized
  # for that band on the slowest machine that still runs the suite. A hosted
  # runner is not a fixed machine — legs on this suite have run ~2x apart
  # between runs — so a run that overshoots the band is reporting the runner,
  # not a regression, and that must not block a merge. It must still be
  # VISIBLE: the shard goes honestly red rather than being wrapped in
  # continue-on-error, so nothing is suppressed, only de-blocked, and only on
  # PRs. On main the same red blocks the branch: a real regression has to stop
  # it, and main's history is where the ratchet's numbers live.
  msg:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/third-party

      # One whole run is the single longest leg here (the manifest's per-pair
      # timeout is 3000 s under TCG), hence the outer bound.
      - name: GUI-5 trophy — user32:msg, budget-ratcheted (tests/run/run.sh guiwtest)
        if: ${{ !cancelled() }}
        run: tests/run/run.sh guiwtest
        env:
          TIMEOUT: "3600"

      - uses: ./.github/actions/serial-logs
        if: failure()
        with:
          shard: msg

  # The one check to require in branch protection: red unless every BLOCKING
  # shard is green. A shard that was SKIPPED or CANCELLED is not green either —
  # a verdict nobody reached must never read as a verdict that passed. Every
  # shard reports its own result on the PR regardless; this job only decides
  # which of them stop a merge.
  all-green:
    needs: [style, setup, boot, oracle, ntapi, cui-a, cui-b, gui, msg]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
          # The advisory set, by event. EMPTY on main — everything blocks
          # there. See the msg job for why user32:msg is in it on PRs.
          ADVISORY: ${{ github.event_name == 'pull_request' && 'msg' || '' }}
        run: |
          fail=0
          while read -r job result; do
            case " $ADVISORY " in
            *" $job "*)
              if [[ "$result" == success ]]; then
                echo "$job: $result"
              else
                echo "::warning::$job: $result — advisory on pull requests, not blocking"
              fi
              continue
              ;;
            esac
            echo "$job: $result"
            [[ "$result" == success ]] || fail=1
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$RESULTS")
          exit "$fail"
