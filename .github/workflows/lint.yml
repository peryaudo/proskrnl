# CI gate: the committed tree is already formatted — running the style tools
# over a checkout must leave it byte-for-byte unchanged.
#
# The same question is asked of the generated contract: `make gen-abi` reads
# the pinned Wine tree's headers, so re-running it must reproduce the
# committed abi/ byte for byte (Art. 4 / gate G4).
#
# Separate workflow from test.yml on purpose: this one needs the apt clang
# toolchain and shallow submodule SOURCES — no configure, no compile of
# anything in third_party — so it answers in minutes instead of waiting
# behind the QEMU/Wine build and the boot suites. Merge blocking is repo
# configuration, not workflow code — add this
# workflow's `lint` check to the same branch protection rule that gates
# `test` (Settings -> Rules -> Rulesets; the check appears in the picker
# after this workflow has run once).
#
# The runner's clang-format/clang-tidy come from the SAME apt packages
# tools/setup_linux.sh installs on Ubuntu 24.04 (clang-format 18), so a
# contributor who ran the documented setup cannot be red here for a version
# difference. A macOS contributor on Homebrew's llvm can be; that is what the
# printed diff is for.
name: lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `make tidy` compiles each TU for real, so it needs the two header-only
      # includes in CFLAGS (Limine's boot protocol, Flanterm's API); no kernel
      # source includes a generated header, so nothing else is needed to
      # parse the tree. `make gen-abi` needs the pinned Wine tree's SOURCES
      # (include/*.h and dlls/ntdll/ntsyscalls.h) — a shallow checkout, not a
      # build, which is why this job skips the cache dance test.yml does.
      # .gitmodules pins third_party/wine by SSH URL and the runner has no SSH
      # key, hence the HTTPS rewrite (same as test.yml).
      - name: Fetch the submodule sources
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 \
            third_party/limine-protocol third_party/flanterm third_party/wine

      - name: Install the clang toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang clang-format clang-tidy make python3

      # clang-format -i over kernel/arch/drivers/fs/user/smss (docs/15).
      # A non-empty diff means the commit was made without `make format`.
      - name: make format leaves the tree unchanged
        run: |
          make format
          if ! git diff --exit-code; then
            echo "::error::clang-format rewrote the tree — run 'make format' and commit the result (docs/15-code-style.md)."
            exit 1
          fi

      # clang-tidy is invoked without --fix, so this leg is two assertions:
      # every TU still parses under the checked-in .clang-tidy (a config or
      # include error fails the target), and the run touched no file. It does
      # NOT gate on warning COUNT — the tree is not warning-clean today, and
      # WarningsAsErrors is empty in .clang-tidy on purpose.
      - name: make tidy leaves the tree unchanged
        run: |
          make tidy
          if ! git diff --exit-code; then
            echo "::error::clang-tidy rewrote the tree — commit the result."
            exit 1
          fi

      # G4 / Art. 4: abi/ is generated, never authored. `make gen-abi` is the
      # only writer of the committed files below, and it is a pure function of
      # the pinned Wine tree — so a diff here means exactly one of two things:
      # a value was hand-edited (or model-recalled) into a generated file, or
      # the Wine pin moved without the regen commit that has to ride with it.
      #
      #     tools/gen_abi.py       abi/nt*.h
      #     tools/gen_syscalls.py  abi/syscall_numbers.h, kernel/syscall/table.inc,
      #                            tests/ntapi/syscall/syscall_stubs.S,
      #                            tests/fuzz/gen/fuzz_model.{h,py}
      #
      # The other four tools/gen_*.py (filter_inf, gen_freetype_syms,
      # gen_server_table, gen_win32u_def) are deliberately NOT here: they write
      # into build/, nothing they emit is committed, and they depend on built
      # Wine artifacts (objects, PE dlls). Every build regenerates them, so
      # `make test` already convicts them — there is no staleness to gate.
      - name: make gen-abi reproduces the committed contract
        run: |
          make gen-abi
          if ! git diff --exit-code; then
            echo "::error::abi/ does not match tools/gen_*.py output — run 'make gen-abi' and commit the result (Constitution Art. 4 / gate G4)."
            exit 1
          fi

      # No target may leave build droppings behind either: an untracked
      # file here means a tool wrote outside the tracked tree.
      - name: No untracked files left behind
        run: |
          untracked="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::the style tools left files behind in the working tree."
            exit 1
          fi
